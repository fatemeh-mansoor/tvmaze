services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tvmaze
      POSTGRES_USER: tvmaze
      POSTGRES_PASSWORD: tvmaze
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvmaze -d tvmaze"]
      interval: 3s
      retries: 20

  db-replica:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: tvmaze
    ports:
      - "5433:5432"
    volumes:
      - replicadata:/var/lib/postgresql/data
      - ./docker/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["bash", "/replica-entrypoint.sh"]

volumes:
  dbdata:
  replicadata:
